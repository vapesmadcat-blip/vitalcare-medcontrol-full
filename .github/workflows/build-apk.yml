name: Build APK MedControl

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install

      - name: Init Capacitor
        run: |
          npx cap init "MedControl" com.vitalcare.medcontrol --web-dir=www

      - name: Add Android
        run: |
          npx cap add android

      - name: Copy native Java
        run: |
          mkdir -p android/app/src/main/java/com/vitalcare/medcontrol
          cp -r native/android/app/src/main/java/com/vitalcare/medcontrol/* android/app/src/main/java/com/vitalcare/medcontrol/

      - name: Copy Manifest
        run: |
          cp native/android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Copy Android icons after sync
        run: |
          cp -r native/android/app/src/main/res/* android/app/src/main/res/
          ls -R android/app/src/main/res/mipmap-mdpi || true
          ls -R android/app/src/main/res/mipmap-hdpi || true
          ls -R android/app/src/main/res/mipmap-xhdpi || true
          ls -R android/app/src/main/res/mipmap-xxhdpi || true
          ls -R android/app/src/main/res/mipmap-xxxhdpi || true

      - name: Force Java 21
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

      - name: Grant Gradle permission
        run: |
          chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medcontrol-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
