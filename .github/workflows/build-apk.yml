name: Build APK MedControl

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar repo
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # 3. Java 17 (CORREÇÃO DO ERRO)
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 4. Instalar Capacitor
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli

      # 5. Inicializar Capacitor
      - name: Init Capacitor
        run: |
          npx cap init "MedControl" com.vitalcare.medcontrol --web-dir=www

      # 6. Adicionar Android
      - name: Add Android
        run: |
          npx cap add android

      # 7. Copiar APP (HTML)
      - name: Copy Web App
        run: |
          cp -r www/* android/app/src/main/assets/public/

      # 8. Copiar ÍCONES (RES)
      - name: Copy Native Resources
        run: |
          cp -r native/android/app/src/main/res/* android/app/src/main/res/

      # 9. Sincronizar
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # 10. Forçar Java correto no Gradle
      - name: Fix Gradle Java
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

      # 11. Permissão Gradle
      - name: Grant Permission
        run: chmod +x android/gradlew

      # 12. Build APK
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 13. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medcontrol-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
