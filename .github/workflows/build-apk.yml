name: Build APK MedControl

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar repo
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # 3. Instalar Capacitor
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli

      # 4. Criar projeto Capacitor
      - name: Init Capacitor
        run: |
          npx cap init medcontrol com.vitalcare.medcontrol --web-dir=www

      # 5. Adicionar Android
      - name: Add Android
        run: |
          npx cap add android

      # 6. Copiar HTML (teu app)
      - name: Copy Web App
        run: |
          cp -r www/* android/app/src/main/assets/public/

      # 7. Copiar recursos nativos (ícones)
      - name: Copy Native Resources
        run: |
          cp -r native/android/app/src/main/res/* android/app/src/main/res/

      # 8. Sincronizar Capacitor
      - name: Sync
        run: |
          npx cap sync android

      # 9. Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medcontrol-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
